{% extends "base_layout.html" %}
{% block title %}Organizacje międzynarodowe{% endblock %}

{% block content %}

<style>
.org-container {
    max-width: 1200px;
    margin: 20px auto 40px auto;
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: #2c3e50;
}

.org-results {
    margin-top: 25px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* ===== FILTER ===== */
.org-filter {
    background: #ffffff;
    border: 1px solid #d3d7dc;
    border-radius: 14px;
    padding: 18px 20px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    margin-bottom: 24px;
}

.org-filter h2 {
    text-align: center;
    font-size: 1.2em;
    font-weight: 800;
    margin-bottom: 16px;
}

.org-filter-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.org-filter label {
    font-size: 0.75em;
    font-weight: 800;
    margin-bottom: 4px;
    display: block;
}

.org-filter select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #bdc3c7;
    font-size: 0.9em;
}

.btn-main {
    padding: 10px 22px;
    border-radius: 8px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    background-color: #2c73d2;
    color: white;
}

/* ===== RESULTS ===== */
.org-card {
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid #d3d7dc;
    padding: 16px 18px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
}

.org-header {
    font-weight: 800;
    font-size: 1.1em;
}

.org-active-yes { color: green; font-weight: 800; }
.org-active-no { color: red; font-weight: 800; }

.org-members {
    margin-top: 6px;
    font-size: 0.9em;
}

.org-actions {
    margin-top: 10px;
    display: flex;
    gap: 8px;
}

.org-actions button {
    padding: 6px 10px;
    border-radius: 6px;
    border: none;
    font-weight: 700;
    cursor: pointer;
}

.btn-view { background: #5d7dce; color:white; }
.btn-edit { background: #3498db; color:white; }
.btn-delete { background: #e74c3c; color:white; }
</style>

<div class="org-container">

    <!-- ===== FILTER ===== -->
    <div class="org-filter">
        <h2>Organizacje międzynarodowe</h2>

        <div class="org-filter-grid">

            <!-- kontynent -->
            <div>
                <label>Kontynent</label>
                <select id="kontynentSelect">
                    <option value="">— wybierz —</option>
                    {% for k in kontynenty %}
                    <option value="{{ k.kontynent_id }}">{{ k.kontynent_nazwa }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- państwo -->
            <div>
                <label>Państwo</label>
                <select id="panstwoSelect" disabled>
                    <option>— wybierz kontynent —</option>
                </select>
            </div>

            <!-- organizacja -->
            <div>
                <label>Organizacja</label>
                <select id="orgSelect">
                    <option value="">— wszystkie —</option>
                    {% for o in organizacje %}
                    <option value="{{ o.ORG_ID }}">{{ o.org_nazwa }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- checkboxy -->
            <div>
                <label>Status</label>
                <div>
                    <input type="checkbox" id="activeOnly"> aktywne
                    <input type="checkbox" id="inactiveOnly"> nieaktywne
                </div>
            </div>

        </div>

        <div style="text-align:center; margin-top:18px;">
            <button id="searchBtn" class="btn-main">Szukaj</button>
        </div>
    </div>

    <!-- ===== RESULTS ===== -->
    <div id="results" class="org-results"></div>

</div>

<script>
const kontynentSelect = document.getElementById("kontynentSelect");
const panstwoSelect = document.getElementById("panstwoSelect");
const orgSelect = document.getElementById("orgSelect");
const results = document.getElementById("results");
const activeOnly = document.getElementById("activeOnly");
const inactiveOnly = document.getElementById("inactiveOnly");

kontynentSelect.addEventListener("change", () => {

    const id = kontynentSelect.value;
    panstwoSelect.innerHTML = "<option>— wybierz —</option>";

    if (!id) return;

    fetch(`/api/dyplomacja/panstwa?kontynent_id=${id}`)
    .then(r => r.json())
    .then(data => {
        data.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p.id;
            opt.textContent = p.nazwa;
            panstwoSelect.appendChild(opt);
        });
        panstwoSelect.disabled = false;
    });
});

document.getElementById("searchBtn").addEventListener("click", () => {

    const params = new URLSearchParams();

    if (panstwoSelect.value) params.append("panstwo_id", panstwoSelect.value);
    if (orgSelect.value) params.append("org_id", orgSelect.value);
    if (activeOnly.checked) params.append("active", "1");
    if (inactiveOnly.checked) params.append("inactive", "1");

    fetch(`/api/dyplomacja/organizacje?${params}`)
    .then(r => r.json())
    .then(data => {

        results.innerHTML = "";

        if (!data.length) {
            results.innerHTML = "<div>Brak wyników</div>";
            return;
        }

        data.forEach(o => {

            const div = document.createElement("div");
            div.className = "org-card";

            const members = o.czlonkowie.map(p => p).join(", ");

            div.innerHTML = `
                <div class="org-header">${o.nazwa} (${o.skrot})</div>
                <div>${o.typ}</div>
                <div>${o.opis || ""}</div>
                <div>Status: 
                    <span class="${o.aktywna ? 'org-active-yes':'org-active-no'}">
                        ${o.aktywna ? 'TAK':'NIE'}
                    </span>
                </div>
                <div class="org-members"><b>Członkowie:</b> ${members}</div>

                <div class="org-actions">
                    <button onclick="window.location.href='/dyplomacja/organizacja/${o.id}'" class="btn-view">Wyświetl</button>
                    <button onclick="window.location.href='/dyplomacja/organizacja/${o.id}/edit'" class="btn-edit">Edytuj</button>
                    <form method="POST" action="/dyplomacja/organizacja/${o.id}/delete" style="display:inline;">
                        <button class="btn-delete">Usuń</button>
                    </form>
                </div>
            `;

            results.appendChild(div);
        });

    });
});
</script>

{% endblock %}
