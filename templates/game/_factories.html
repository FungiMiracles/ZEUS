<div id="industry-workspace"><section class="game-panel factory-panel"><h2 id="industry-heading" class="game-panel-heading">Budowa fabryk</h2><div class="game-panel-body">
<p id="industry-status" role="status">Ładowanie obiektów…</p><div id="industry-build-cards" class="industry-build-cards"></div>
<p id="industry-placement" role="status" hidden></p><button type="button" id="industry-cancel" hidden>Anuluj wskazywanie</button><div id="industry-mine-filters" class="military-map-filters" role="group" aria-label="Rodzaje kopalń na mapie i liście" hidden></div><div id="factory-map" aria-label="Mapa obiektów infrastrukturalnych"></div>
<h3>Twoje obiekty</h3><div id="industry-records" class="industry-records"></div></div></section></div>
<dialog id="industry-confirm"><h2 class="industry-confirm-heading"><img id="industry-confirm-icon" alt="" width="36" height="36"><span id="industry-confirm-title"></span></h2><div id="industry-confirm-product" class="industry-confirm-product" hidden></div><p id="industry-confirm-text"></p><label id="industry-quantity-row" class="industry-quantity-row" hidden>Liczba sztuk do wyprodukowania <input id="industry-quantity" type="number" min="1" step="1" value="1" inputmode="numeric"></label><p id="industry-error" role="alert"></p><div class="industry-modal-actions"><button type="button" id="industry-close">Anuluj</button><button type="button" id="industry-apply">Zatwierdź</button></div></dialog>

<dialog id="factory-details-dialog" aria-labelledby="factory-details-title">
    <h2 id="factory-details-title" class="factory-details-title"></h2>
    <p class="factory-details-label">Surowce/części potrzebne do produkcji:</p>
    <div id="factory-details-inputs" class="factory-details-inputs"></div>
    <div class="industry-modal-actions"><button type="button" id="factory-details-close" autofocus>Zamknij</button></div>
</dialog>
