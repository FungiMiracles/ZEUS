{% extends "base_layout.html" %}

{% block title %}
Kultura — Przypisz języki do państwa
{% endblock %}

{% block content %}

<style>
.jezyk-przypisz {
    max-width: 1100px;
    margin: 25px auto 40px auto;
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: #2c3e50;
}

.section-box {
    background: #ffffff;
    border: 1px solid #d3d7dc;
    border-radius: 12px;
    padding: 22px 26px;
    margin-bottom: 25px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}

.section-box h2 {
    font-size: 1.25em;
    font-weight: 800;
    margin-bottom: 15px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
}

label {
    font-weight: 700;
    margin-bottom: 6px;
    display: block;
}

.btn-zeus {
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 0.9em;
    font-weight: 700;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s ease;
}

.btn-save {
    background-color: #27ae60;
    color: #ffffff;
}

.btn-save:hover {
    background-color: #1e8749;
    text-decoration: none !important;
}

.btn-cancel {
    background-color: #c73424;
    color: #ffffff;
}

.btn-cancel:hover {
    background-color: #96271b;
    text-decoration: none !important;
    color: #ffffff;
}

/* ============================================================
   ZEUS — KULTURA: PRZYPISANIE JĘZYKÓW (MOBILE)
============================================================ */

@media (max-width: 768px) {

    .jezyk-przypisz {
        margin: 15px 10px 30px 10px;
    }

    /* ===== SEKCJE ===== */

    .section-box {
        padding: 16px 16px;
        margin-bottom: 18px;
    }

    .section-box h2 {
        font-size: 1.1em;
        margin-bottom: 12px;
    }

    /* ===== GRID ===== */

    .grid {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    /* ===== LABELS ===== */

    label {
        font-size: 0.9em;
        margin-bottom: 4px;
    }

    /* ===== SELECT / INPUT ===== */

    select.form-control,
    input.form-control {
        font-size: 1em;
        padding: 9px 10px;
    }

    /* ===== PRZYCISKI ===== */

    .btn {
        width: 100%;
        padding: 10px 0;
        font-size: 1em;
    }

    /* ===== DOLNE AKCJE ===== */

    form > div:last-child {
        margin-top: 20px;
    }
}

</style>

<div class="jezyk-przypisz">

    <h1 style="text-align:center;margin-bottom:30px;">
        Przypisz języki do państwa
    </h1>

    <form method="POST">

        <!-- ===============================
             PAŃSTWO
        =============================== -->
        <div class="section-box">
            <h2>Państwo</h2>

            <div class="grid">
                <div>
                    <label>Kontynent</label>
                    <select id="filter-kontynent" class="form-control">
                        <option value="">— wybierz —</option>
                        <option value="1">Kao</option>
                        <option value="2">Beifa</option>
                        <option value="3">Anzinia</option>
                        <option value="6">Peryfa</option>
                        <option value="4">Wyspy Większe</option>
                        <option value="5">Wyspy Mniejsze</option>
                    </select>
                </div>

                <div>
                    <label>Państwo</label>
                    <select id="filter-panstwo" name="panstwo_id" class="form-control" disabled>
                        <option value="">— wybierz kontynent —</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- ===============================
             JĘZYKI URZĘDOWE
        =============================== -->
        <div class="section-box">
            <h2>Języki urzędowe</h2>

            <div class="grid">
                <select id="jezyk_urzedowy1"
                        name="jezyk_urzedowy1"
                        class="form-control"
                        required></select>

                <select id="jezyk_urzedowy2"
                        name="jezyk_urzedowy2"
                        class="form-control"></select>

                <select id="jezyk_urzedowy3"
                        name="jezyk_urzedowy3"
                        class="form-control"></select>
            </div>
        </div>

        <!-- ===============================
             JĘZYKI MNIEJSZOŚCIOWE
        =============================== -->
        <div class="section-box">
            <h2>Języki mniejszościowe</h2>

            <div class="grid">
                <select id="jezyk_mniejszosciowy1"
                        name="jezyk_mniejszosciowy1"
                        class="form-control"></select>

                <select id="jezyk_mniejszosciowy2"
                        name="jezyk_mniejszosciowy2"
                        class="form-control"></select>

                <select id="jezyk_mniejszosciowy3"
                        name="jezyk_mniejszosciowy3"
                        class="form-control"></select>

                <select id="jezyk_mniejszosciowy4"
                        name="jezyk_mniejszosciowy4"
                        class="form-control"></select>

                <select id="jezyk_mniejszosciowy5"
                        name="jezyk_mniejszosciowy5"
                        class="form-control"></select>
            </div>
        </div>

        <div style="text-align:center;margin-top:30px;">
            <button class="btn-zeus btn-save">Zapisz</button>
            <a href="{{ url_for('kultura_jezyki') }}" class="btn-zeus btn-cancel">Anuluj</a>
        </div>

    </form>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const kontynent = document.getElementById("filter-kontynent");
    const panstwo = document.getElementById("filter-panstwo");
    const selects = document.querySelectorAll("select[name^='jezyk_']");

    // ----- państwa -----
    kontynent.addEventListener("change", () => {
        panstwo.disabled = true;
        panstwo.innerHTML = "<option>Ładowanie...</option>";

        fetch(`/api/kultura/panstwa_by_kontynent?kontynent_id=${encodeURIComponent(kontynent.value)}`)
            .then(r => r.json())
            .then(data => {
                panstwo.disabled = false;
                panstwo.innerHTML = "<option value=''>— wybierz —</option>";
                data.forEach(p => {
                    const o = document.createElement("option");
                    o.value = p.id;
                    o.textContent = p.nazwa;
                    panstwo.appendChild(o);
                });
            });
    });

    // ----- języki -----
    fetch("/api/kultura/jezyki")
        .then(r => r.json())
        .then(data => {
            selects.forEach(sel => {
                sel.innerHTML = "<option value=''>— brak —</option>";
                data.forEach(j => {
                    const o = document.createElement("option");
                    o.value = j.id;
                    o.textContent = j.nazwa;
                    sel.appendChild(o);
                });
            });
        });

});

document.getElementById("filter-panstwo").addEventListener("change", async function () {

    const panstwoId = this.value;

    const pola = [
        "jezyk_urzedowy1",
        "jezyk_urzedowy2",
        "jezyk_urzedowy3",
        "jezyk_mniejszosciowy1",
        "jezyk_mniejszosciowy2",
        "jezyk_mniejszosciowy3",
        "jezyk_mniejszosciowy4",
        "jezyk_mniejszosciowy5"
    ];

    // wyczyść pola
    pola.forEach(id => {
        document.getElementById(id).value = "";
    });

    if (!panstwoId)
        return;

    const response = await fetch(`/api/jezyki_per_panstwo/${panstwoId}`);
    const data = await response.json();

    pola.forEach(id => {
        if (data[id] !== null) {
            document.getElementById(id).value = data[id];
        }
    });

});
</script>

{% endblock %}
