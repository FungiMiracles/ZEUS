{% extends 'base_layout.html' %}
{% block title %}Historia{% endblock %}
{% block content %}
<style>
    .hist-header { text-align: center; margin: 20px 0 40px; }
    .hist-header h2 { font-weight: 800; color: #6e4420; text-transform: uppercase; }
    .hist-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
    .hist-card {
        background: #fff; border: 1px solid #d3c4b4; border-radius: 15px; padding: 45px 25px;
        text-align: center; text-decoration: none !important; transition: 0.4s;
        display: flex; flex-direction: column; align-items: center;
    }
    .hist-card i { font-size: 3.5rem; color: #8b5a2b; margin-bottom: 20px; }
    .hist-card h5 { color: #5a361a; font-weight: 800; font-size: 1.3rem; }
    .hist-card:hover { border-color: #8b5a2b; box-shadow: 0 10px 25px rgba(139, 90, 43, 0.2); transform: translateY(-5px); }
</style>
<div class="hist-header"><h2><i class="fas fa-scroll mr-2"></i> Archiwa i Kroniki</h2></div>
<div class="hist-grid">
    <a href="{{ url_for('historia_lista') }}" class="hist-card">
        <i class="fas fa-monument"></i>
        <h5>Historia Państw</h5>
    </a>
    <a href="{{ url_for('historia_swiata') }}" class="hist-card">
        <i class="fas fa-landmark"></i>
        <h5>Wydarzenia Globalne</h5>
    </a>
</div>
{% endblock %}
