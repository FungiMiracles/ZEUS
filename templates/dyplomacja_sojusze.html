{% extends "base_layout.html" %}
{% block title %}Sojusze i bloki{% endblock %}

{% block content %}

<style>
/* ============================================================
   ZEUS — SOJUSZE I BLOKI
============================================================ */

.soj-container {
    max-width: 1200px;
    margin: 20px auto 40px auto;
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: #2c3e50;
}

.sojusze-results {
    margin-top: 25px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* ===================== FILTR ===================== */

.soj-filter {
    background: #ffffff;
    border: 1px solid #d3d7dc;
    border-radius: 14px;
    padding: 18px 20px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    margin-bottom: 24px;
}

.soj-filter h2 {
    text-align: center;
    font-size: 1.2em;
    font-weight: 800;
    margin-bottom: 16px;
}

.soj-filter-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.soj-filter label {
    font-size: 0.75em;
    font-weight: 800;
    margin-bottom: 4px;
    display: block;
}

.soj-filter select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #bdc3c7;
    font-size: 0.9em;
}

.soj-select-box label {
    font-size: 0.75em;
    font-weight: 800;
    margin-bottom: 4px;
    display: block;
}

.btn-main {
    padding: 10px 22px;
    border-radius: 8px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    background-color: #5d7dce;
    color: white;
}

.btn-main:hover {
    background-color: #315eb8;
}

/* ===================== LISTA RELACJI ===================== */

.soj-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.soj-card {
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid #d3d7dc;
    padding: 16px 18px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    align-items: center;
}

.soj-country {
    font-weight: 800;
    font-size: 1.05em;
}

.soj-badge {
    padding: 6px 10px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.85em;
    text-align: center;
}

/* ===== KOLORY ===== */
.rel-green { background: #d4edda; color: #155724; }
.rel-grey  { background: #ecf0f1; color: #2c3e50; }
.rel-orange{ background: #ffe5c2; color: #8a4b00; }
.rel-red   { background: #f8d7da; color: #721c24; }

/* ===================== MOBILE ===================== */

@media (max-width: 768px) {

    .soj-filter-grid {
        grid-template-columns: 1fr;
    }

    .soj-card {
        grid-template-columns: 1fr;
        text-align: center;
    }
}
</style>

<div class="soj-container">

    <!-- ===================== FILTR ===================== -->
    <div class="soj-filter">
        <h2>Sojusze i bloki</h2>

        <div class="soj-filter-grid">

            <div class="soj-select-box">
               <label for="kontynentSelect">Kontynent</label>
               <select id="kontynentSelect">
                <option value="">— wybierz —</option>

                {% for k in kontynenty %}
                <option value="{{ k.kontynent_id }}">
                    {{ k.kontynent_nazwa }}
                </option>
                {% endfor %}

                </select>
           </div>

            <div class="dyp-select-box">
               <label for="panstwoSelect">Państwo</label>
               <select id="panstwoSelect" disabled>
                   <option value="">— wybierz kontynent —</option>
               </select>
           </div>

            <div class="dyp-select-box">
               <label for="relacjaFilter">Relacja (opcjonalnie)</label>
               <select id="relacjaFilter">
                   <option value="">— wszystkie —</option>
                   <option value="sojusznicze">Sojusznicze</option>
                   <option value="partnerskie_strategiczne">Partnerskie strategiczne</option>
                   <option value="partnerskie">Partnerskie</option>
                   <option value="przyjazne">Przyjazne</option>
                   <option value="dobre">Dobre</option>
                   <option value="neutralne">Neutralne</option>
                   <option value="chlodne">Chłodne</option>
                   <option value="zle">Złe</option>
                   <option value="napiete">Napięte</option>
                   <option value="wrogie">Wrogie</option>
                   <option value="egzystencjalnie_wrogie">Egzystencjalnie wrogie</option>
               </select>
           </div>

            <div class="dyp-select-box">
               <label for="stanFilter">Stan (opcjonalnie)</label>
               <select id="stanFilter">
                   <option value="">— wszystkie —</option>
                   <option value="pokoj">Pokój</option>
                   <option value="zawieszenie_broni">Zawieszenie broni</option>
                   <option value="konflikt_dyplomatyczny">Konflikt dyplomatyczny</option>
                   <option value="wojna_handlowa">Wojna handlowa</option>
                   <option value="wojna_informacyjna">Wojna informacyjna</option>
                   <option value="wojna_hybrydowa">Wojna hybrydowa</option>
                   <option value="konflikt_kinetyczny_zamrozony">Konflikt kinetyczny (zamrożony)</option>
                   <option value="wojna_kinetyczna">Wojna kinetyczna</option>
                   <option value="okupacja">Okupacja</option>
               </select>
           </div>

        </div>
       <div style="text-align:center; margin-top:18px;">
          <button id="sojSearchBtn" class="btn-main" style="background:#2c73d2;">
              Filtruj
          </button>
      </div>
    </div>

    <!-- ===================== WYNIKI ===================== -->
    <div id="sojuszeResults" class="sojusze-results">
    <!-- tutaj JS wstawi wyniki -->
   </div>

</div>

<script>
const kontynentSelect = document.getElementById("kontynentSelect");
const panstwoSelect = document.getElementById("panstwoSelect");
const relacjaFilter = document.getElementById("relacjaFilter");
const stanFilter = document.getElementById("stanFilter");
const sojList = document.getElementById("sojuszeResults");

const RELACJA_MAP = {
    sojusznicze: {
        label: "Sojusznicze",
        class: "rel-green"
    },
    partnerskie_strategiczne: {
        label: "Partnerskie strategiczne",
        class: "rel-green"
    },
    partnerskie: {
        label: "Partnerskie",
        class: "rel-green"
    },
    przyjazne: {
        label: "Przyjazne",
        class: "rel-green"
    },
    dobre: {
        label: "Dobre",
        class: "rel-green"
    },
    neutralne: {
        label: "Neutralne",
        class: "rel-grey"
    },
    chlodne: {
        label: "Chłodne",
        class: "rel-orange"
    },
    zle: {
        label: "Złe",
        class: "rel-red"
    },
    napiete: {
        label: "Napięte",
        class: "rel-red"
    },
    wrogie: {
        label: "Wrogie",
        class: "rel-red"
    },
    egzystencjalnie_wrogie: {
        label: "Egzystencjalnie wrogie",
        class: "rel-red"
    }
};

const STAN_MAP = {
    pokoj: {
        label: "Pokój",
        class: "rel-green"
    },
    zawieszenie_broni: {
        label: "Zawieszenie broni",
        class: "rel-orange"
    },
    konflikt_dyplomatyczny: {
        label: "Konflikt dyplomatyczny",
        class: "rel-orange"
    },
    wojna_handlowa: {
        label: "Wojna handlowa",
        class: "rel-orange"
    },
    wojna_informacyjna: {
        label: "Wojna informacyjna",
        class: "rel-orange"
    },
    wojna_hybrydowa: {
        label: "Wojna hybrydowa",
        class: "rel-red"
    },
    konflikt_kinetyczny_zamrozony: {
        label: "Konflikt kinetyczny (zamrożony)",
        class: "rel-red"
    },
    wojna_kinetyczna: {
        label: "Wojna kinetyczna",
        class: "rel-red"
    },
    okupacja: {
        label: "Okupacja",
        class: "rel-red"
    }
};

function toKey(v) {
    if (!v) return "";
    return v
        .toLowerCase()
        .replace(/ /g, "_")
        .replace(/[ąćęłńóśżź]/g, c => ({
            "ą":"a","ć":"c","ę":"e","ł":"l","ń":"n","ó":"o","ś":"s","ż":"z","ź":"z"
        }[c]));
}

kontynentSelect.addEventListener("change", () => {
    const kontynent = kontynentSelect.value;

    panstwoSelect.innerHTML = '<option value="">— wybierz —</option>';
    panstwoSelect.disabled = true;
    sojList.innerHTML = "";

    if (!kontynent) return;

    fetch(`/api/dyplomacja/panstwa?kontynent_id=${encodeURIComponent(kontynent)}`)
        .then(res => res.json())
        .then(data => {
            console.log("PAŃSTWA:", data);

            data.forEach(p => {
                const opt = document.createElement("option");
                opt.value = p.id;
                opt.textContent = p.nazwa;
                panstwoSelect.appendChild(opt);
            });

            // 🔑 TO JEST KLUCZOWE
            panstwoSelect.disabled = false;
        })
        .catch(err => {
            console.error("Błąd API:", err);
        });
});

const searchBtn = document.getElementById("sojSearchBtn");

searchBtn.addEventListener("click", () => {
    const panstwoId = panstwoSelect.value;
    const relacja = relacjaFilter.value;
    const stan = stanFilter.value;

    sojList.innerHTML = "";

    if (!panstwoId) {
        sojList.innerHTML = "<div style='text-align:center; font-weight:700;'>Wybierz państwo.</div>";
        return;
    }

    const params = new URLSearchParams({
        panstwo_id: panstwoId
    });

    if (relacja) params.append("relacja", relacja);
    if (stan) params.append("stan", stan);

    fetch(`/api/dyplomacja/sojusze?${params.toString()}`)
        .then(res => res.json())
        .then(data => {
            if (data.length === 0) {
                sojList.innerHTML = "<div style='text-align:center; font-weight:700;'>Brak relacji.</div>";
                return;
            }

            data.forEach(r => {
                const card = document.createElement("div");
                card.className = "soj-card";
            
                const relKey = toKey(r.relacja);
                const stanKey = toKey(r.stan);

                const rel = RELACJA_MAP[relKey] || {
                    label: r.relacja,
                    class: "rel-grey"
                };

                const stanObj = STAN_MAP[stanKey] || {
                    label: r.stan,
                    class: "rel-grey"
                };
            
                card.innerHTML = `
                    <div class="soj-country">${r.panstwo_nazwa}</div>
                    <div class="soj-badge ${rel.class}">${rel.label}</div>
                    <div class="soj-badge ${stanObj.class}">${stanObj.label}</div>
                `;
            
                sojList.appendChild(card);
            });
        })
        .catch(err => {
            console.error(err);
            sojList.innerHTML = "<div>Błąd pobierania danych.</div>";
        });
});
</script>


{% endblock %}
