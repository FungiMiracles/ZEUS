{% extends 'base_layout.html' %}
{% block title %}Natura{% endblock %}

{% block content %}
<style>
    .module-header { text-align: center; margin-bottom: 40px; }
    .module-header h2 { font-weight: 800; color: var(--zeus-dark); }

    .zeus-grid-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        padding: 10px;
    }

    .tile-card {
        background: #ffffff;
        border: 1px solid #e1e5ea;
        border-radius: 16px;
        padding: 30px 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .tile-card i {
        font-size: 2.5rem;
        color: #27ae60;
        margin-bottom: 15px;
    }

    .tile-card:hover {
        transform: translateY(-5px);
        border-color: #27ae60;
        box-shadow: 0 12px 20px -5px rgba(39,174,96,0.2);
    }

    .tile-locked {
        background: #f8fafc;
        opacity: 0.7;
        cursor: not-allowed;
    }
</style>

<div class="module-header">
    <h2><i class="fas fa-leaf mr-2"></i> Natura</h2>
    <p>Świat przyrody, środowisko i systemy naturalne.</p>
</div>

<div class="zeus-grid-tiles">

    <div class="tile-card tile-locked" onclick="zeusToast('Moduł w budowie')">
        <i class="fas fa-globe"></i>
        <h5>Kosmos</h5>
    </div>

    <div class="tile-card tile-locked" onclick="zeusToast('Moduł w budowie')">
        <i class="fas fa-user"></i>
        <h5>Człowiek</h5>
    </div>

    <div class="tile-card tile-locked" onclick="zeusToast('Moduł w budowie')">
        <i class="fas fa-seedling"></i>
        <h5>Flora</h5>
    </div>

    <div class="tile-card tile-locked" onclick="zeusToast('Moduł w budowie')">
        <i class="fas fa-paw"></i>
        <h5>Fauna</h5>
    </div>

</div>

{% endblock %}
