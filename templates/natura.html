{% extends 'base_layout.html' %}
{% block title %}Gospodarka{% endblock %}

{% block content %}
<style>
.module-header {
    text-align: center;
    margin-bottom: 40px;
}
.module-header h2 {
    font-weight: 800;
    color: var(--zeus-dark);
    letter-spacing: -1px;
}
.module-header p { color: #64748b; font-size: 1rem; }

.zeus-grid-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    padding: 10px;
}

.tile-card {
    background: #ffffff;
    border: 1px solid #e1e5ea;
    border-radius: 16px;
    padding: 30px 20px;
    text-align: center;
    text-decoration: none !important;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.3s cubic-bezier(0.25,0.8,0.25,1);
}

.tile-card i {
    font-size: 2.5rem;
    color: #2c73d2;
    margin-bottom: 15px;
    transition: transform 0.3s ease;
}

.tile-card h5 { font-weight: 700; margin-bottom: 8px; }
.tile-card span { font-size: 0.85rem; color: #94a3b8; }

.tile-card:hover {
    transform: translateY(-5px);
    border-color: #2c73d2;
    box-shadow: 0 12px 20px -5px rgba(44,115,210,0.2);
}
.tile-card:hover i { transform: scale(1.1); }
</style>

<div class="module-header">
    <h2><i class="fas fa-chart-line mr-2"></i> Gospodarka</h2>
    <p>Dane ekonomiczne, analiza i rozwój państw.</p>
</div>

<div class="zeus-grid-tiles">

    <a href="{{ url_for('gospodarka_list') }}" class="tile-card">
        <i class="fas fa-coins"></i>
        <h5>Przegląd</h5>
        <span>Dane gospodarcze państw.</span>
    </a>

    <a href="{{ url_for('gospodarka_porownaj') }}" class="tile-card">
        <i class="fas fa-chart-line"></i>
        <h5>Porównanie</h5>
        <span>Porównanie gospodarek.</span>
    </a>

</div>

{% endblock %}
