{% extends 'base_layout.html' %}
{% block title %}Siły zbrojne{% endblock %}
{% block content %}
<style>
    .army-header { text-align: center; margin: 20px 0 40px; }
    .army-header h2 { font-weight: 800; color: #c0392b; text-transform: uppercase; }
    .army-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
    .army-card {
        background: #fff; border: 2px solid #f2f2f2; border-radius: 12px; padding: 35px 20px;
        text-align: center; text-decoration: none !important; transition: 0.3s;
        display: flex; flex-direction: column; align-items: center; position: relative;
    }
    .army-card i { font-size: 3rem; color: #c0392b; margin-bottom: 15px; }
    .army-card h5 { color: #2c3e50; font-weight: 700; text-transform: uppercase; font-size: 0.95rem; }
    .army-card:hover { border-color: #c0392b; background: #fff9f9; transform: translateY(-5px); }
</style>
<div class="army-header"><h2><i class="fas fa-shield-alt mr-2"></i> Potencjał Militarny</h2></div>
<div class="army-grid">
    <a href="{{ url_for('sily_zbrojne_list') }}" class="army-card">
        <i class="fas fa-list-ul"></i>
        <h5>Przegląd Zasobów</h5>
    </a>
    <a href="{{ url_for('porownywarka_armia') }}" class="army-card">
        <i class="fas fa-balance-scale"></i>
        <h5>Porównywarka Państw</h5>
    </a>
    {% if session.rola == "wszechmocny" %}
    <a href="{{ url_for('sily_zbrojne_add') }}" class="army-card">
        <i class="fas fa-plus-circle"></i>
        <h5>Zarządzaj Jednostkami</h5>
    </a>
    {% endif %}
</div>
{% endblock %}
