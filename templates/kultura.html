{% extends 'base_layout.html' %}
{% block title %}Kultura{% endblock %}
{% block content %}
<style>
    .kult-header { text-align: center; margin: 20px 0 40px; }
    .kult-header h2 { font-weight: 800; color: #d4a017; }
    .kult-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
    .kult-card {
        background: #fff; border: 1px solid #eee; border-radius: 20px; padding: 40px;
        text-align: center; text-decoration: none !important; transition: 0.3s;
        display: flex; flex-direction: column; align-items: center;
    }
    .kult-card i { font-size: 3rem; color: #d4a017; margin-bottom: 15px; }
    .kult-card h5 { color: #444; font-weight: 700; }
    .kult-card:hover { border-color: #d4a017; box-shadow: 0 10px 20px rgba(212, 160, 23, 0.1); background: #fffdf5; }
</style>
<div class="kult-header"><h2><i class="fas fa-theater-masks mr-2"></i> Kultura i Dziedzictwo</h2></div>
<div class="kult-grid">
    <a href="{{ url_for('religia_list') }}" class="kult-card">
        <i class="fas fa-pray"></i>
        <h5>Religie i Wyznania</h5>
    </a>
    <a href="{{ url_for('jezyki_list') }}" class="kult-card">
        <i class="fas fa-language"></i>
        <h5>Języki Świata</h5>
    </a>
</div>
{% endblock %}
