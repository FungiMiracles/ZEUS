{% extends "base_layout.html" %}
{% block title %}Edytuj wydarzenie – {{ h.nazwa_wydarzenia }}{% endblock %}

{% block content %}

<style>
/* ============================================================
   ZEUS — EDYCJA WYDARZENIA HISTORYCZNEGO
============================================================ */

.historia-edit-wrapper {
    max-width: 900px;
    margin: 30px auto;
    font-family: "Segoe UI", Tahoma, sans-serif;
}

/* ===== TYTUŁ ===== */

.historia-edit-title {
    font-size: 1.6em;
    font-weight: 800;
    color: #2c3e50;
    margin-bottom: 18px;
}

/* ===== SEKCJE ===== */

.historia-section {
    background: #f4f6f8;
    border: 1px solid #d3d7dc;
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 22px;
}

.historia-section h3 {
    font-size: 1.05em;
    font-weight: 800;
    color: #34495e;
    margin-bottom: 14px;
}

/* ===== POLA ===== */

.historia-field {
    margin-bottom: 14px;
}

.historia-field label {
    display: block;
    font-weight: 700;
    font-size: 0.85em;
    color: #2c3e50;
    margin-bottom: 4px;
}

.historia-field input,
.historia-field select,
.historia-field textarea {
    width: 100%;
    padding: 9px 11px;
    border-radius: 6px;
    border: 1px solid #b4b9be;
    font-size: 0.95em;
    font-weight: 600;
    box-sizing: border-box;
}

.historia-field textarea {
    resize: vertical;
}

/* ===== AKCJE ===== */

.historia-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 26px;
}

.historia-actions .right {
    display: flex;
    gap: 10px;
}

/* ===== PRZYCISKI ===== */

.btn-zeus {
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 0.9em;
    font-weight: 700;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s ease;
}

a.btn-zeus,
a.btn-zeus:hover,
a.btn-zeus:focus,
a.btn-zeus:active {
    text-decoration: none !important;
}

.btn-cancel {
    background-color: #eaeaea;
    color: #34495e;
    border: 1.5px solid #bdc3c7;
}

.btn-cancel:hover {
    background-color: #999999;
}

.btn-save {
    background-color: #27ae60;
    color: white;
}

.btn-save:hover {
    background-color: #1e8749;
}

/* ============================================================
   ZEUS — HISTORIA: UJEDNOLICONE HOVERY PRZYCISKÓW
============================================================ */

.historia-wrapper a:hover,
.historia-wrapper a:focus,
.historia-wrapper a:active,
.historia-edit-wrapper a:hover,
.historia-edit-wrapper a:focus,
.historia-edit-wrapper a:active,
.historia-add-wrapper a:hover,
.historia-add-wrapper a:focus,
.historia-add-wrapper a:active,
.historia-wrapper button:hover,
.historia-wrapper button:focus,
.historia-edit-wrapper button:hover,
.historia-edit-wrapper button:focus,
.historia-add-wrapper button:hover,
.historia-add-wrapper button:focus {
    text-decoration: none !important;
    color: inherit !important;
}

/* ===== MOBILE ===== */

@media (max-width: 640px) {

    .historia-edit-wrapper {
        margin: 16px 10px;
    }

    .historia-edit-title {
        font-size: 1.35em;
    }

    .historia-section {
        padding: 16px 14px;
    }

    .historia-actions {
        flex-direction: column;
        gap: 12px;
        align-items: stretch;
    }

    .historia-actions .right {
        flex-direction: column;
        gap: 10px;
    }

    .btn-zeus {
        width: 100%;
        text-align: center;
    }
}
</style>

<div class="historia-edit-wrapper">

    <div class="historia-edit-title">
        Edytuj wydarzenie historyczne
    </div>

    <form method="POST">

        <!-- ===== PODSTAWOWE INFORMACJE ===== -->
        <div class="historia-section">
            <h3>Podstawowe informacje</h3>

            <div class="historia-field">
                <label>Nazwa wydarzenia *</label>
                <input type="text"
                       name="nazwa_wydarzenia"
                       value="{{ h.nazwa_wydarzenia }}"
                       required>
            </div>

            <div class="historia-field">
                <label>Epoka *</label>
                <select name="epoka" required>
                    <option value="">— wybierz —</option>
                    <option value="starozytna" {% if h.epoka == "starozytna" %}selected{% endif %}>Starożytna</option>
                    <option value="sredniowieczna" {% if h.epoka == "sredniowieczna" %}selected{% endif %}>Średniowieczna</option>
                    <option value="wspolczesna" {% if h.epoka == "wspolczesna" %}selected{% endif %}>Współczesna</option>
                </select>
            </div>
        </div>

        <!-- ===== CZAS ===== -->
        <div class="historia-section">
            <h3>Czas trwania</h3>

            <div class="historia-field">
                <label>Data od *</label>
                <input type="text"
                       name="data_od"
                       value="{{ h.data_od.year }}"
                       required>
            </div>

            <div class="historia-field">
                <label>Data do</label>
                <input type="text"
                       name="data_do"
                       value="{{ h.data_do.year if h.data_do }}">
            </div>
        </div>

        <!-- ===== LOKALIZACJA ===== -->
        <div class="historia-section">
            <h3>Lokalizacja</h3>

            <div class="historia-field">
                <label>Kontynent</label>
                <select name="kontynent" id="kontynentSelect">
                    <option value="">— brak —</option>
                    {% for k in ["Kao","Beifa","Anzinia","Peryfa","Wyspy Większe","Wyspy Mniejsze"] %}
                        <option value="{{ k }}" {% if h.kontynent == k %}selected{% endif %}>{{ k }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="historia-field">
                <label>Państwo</label>
                <select name="panstwo_id" id="panstwoSelect">
                    <option value="">— brak —</option>
                    {% for p in panstwa %}
                        <option value="{{ p.PANSTWO_ID }}" {% if h.panstwo_id == p.PANSTWO_ID %}selected{% endif %}>
                            {{ p.panstwo_nazwa }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="historia-field">
                <label>Region</label>
                <select name="region_id" id="regionSelect" disabled>
                    <option value="">— brak —</option>
                </select>
            </div>

            <div class="historia-field">
                <label>Miasto</label>
                <select name="miasto_id" id="miastoSelect" disabled>
                    <option value="">— brak —</option>
                </select>
            </div>
        </div>

        <!-- ===== OPIS ===== -->
        <div class="historia-section">
            <h3>Opis wydarzenia</h3>

            <div class="historia-field">
                <textarea name="wydarzenie_opis"
                          rows="14">{{ h.wydarzenie_opis }}</textarea>
            </div>
        </div>

        <!-- ===== AKCJE ===== -->
        <div class="historia-actions">

            <a href="{{ url_for('historia_podglad', historia_id=h.HISTORIA_ID) }}"
               class="btn-zeus btn-cancel">
                Anuluj
            </a>

            <div class="right">
                <button type="submit"
                        class="btn-zeus btn-save">
                    Zapisz zmiany
                </button>
            </div>

        </div>

    </form>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const kontynent = document.getElementById("kontynentSelect");
    const panstwo   = document.getElementById("panstwoSelect");
    const region    = document.getElementById("regionSelect");
    const miasto    = document.getElementById("miastoSelect");

    function reset(select, label) {
        select.innerHTML = `<option value="">${label}</option>`;
        select.disabled = true;
    }

    /* ===== STAN POCZĄTKOWY ===== */
    reset(panstwo, "— wybierz kontynent —");
    reset(region,  "— brak —");
    reset(miasto,  "— brak —");

    /* ===== KONTYNENT → PAŃSTWA ===== */
    kontynent.addEventListener("change", () => {

        reset(panstwo, "— wybierz państwo —");
        reset(region,  "— brak —");
        reset(miasto,  "— brak —");

        if (!kontynent.value) return;

        fetch(`/api/panstwa_by_kontynent?kontynent=${encodeURIComponent(kontynent.value)}`)
            .then(r => r.json())
            .then(data => {
                data.forEach(p => {
                    const opt = document.createElement("option");
                    opt.value = p.id;
                    opt.textContent = p.nazwa;
                    panstwo.appendChild(opt);
                });
                panstwo.disabled = false;
            });
    });

    /* ===== PAŃSTWO → REGIONY ===== */
    panstwo.addEventListener("change", () => {

        reset(region, "— wybierz region —");
        reset(miasto, "— brak —");

        if (!panstwo.value) return;

        fetch(`/api/regiony_by_panstwo?panstwo_id=${panstwo.value}`)
            .then(r => r.json())
            .then(data => {
                data.forEach(r => {
                    const opt = document.createElement("option");
                    opt.value = r.region_id;
                    opt.textContent = r.region_nazwa;
                    region.appendChild(opt);
                });
                region.disabled = false;
            });
    });

    /* ===== REGION → MIASTA ===== */
    region.addEventListener("change", () => {
        loadMiasta(region.value);
    });

    function loadMiasta(regionId, selectedMiastoId = null) {

        reset(miasto, "— wybierz miasto —");

        if (!regionId) return;

        fetch(`/api/miasta_by_region?region_id=${regionId}`)
            .then(r => r.json())
            .then(data => {
                data.forEach(m => {
                    const opt = document.createElement("option");
                    opt.value = m.miasto_id;
                    opt.textContent = m.miasto_nazwa;

                    if (String(m.miasto_id) === String(selectedMiastoId)) {
                        opt.selected = true;
                    }

                    miasto.appendChild(opt);
                });

                /* 🔑 ABSOLUTNIE KLUCZOWE */
                miasto.disabled = false;
            });
    }

    /* ===== PREFILL (EDIT) ===== */
    const initialPanstwo = "{{ h.panstwo_id or '' }}";
    const initialRegion  = "{{ h.region_id or '' }}";
    const initialMiasto  = "{{ h.miasto_id or '' }}";

    if (initialPanstwo) {
        panstwo.value = initialPanstwo;
        panstwo.disabled = false;

        fetch(`/api/regiony_by_panstwo?panstwo_id=${initialPanstwo}`)
            .then(r => r.json())
            .then(data => {
                data.forEach(r => {
                    const opt = document.createElement("option");
                    opt.value = r.region_id;
                    opt.textContent = r.region_nazwa;
                    if (String(r.region_id) === String(initialRegion)) {
                        opt.selected = true;
                    }
                    region.appendChild(opt);
                });

                region.disabled = false;

                if (initialRegion) {
                    loadMiasta(initialRegion, initialMiasto);
                }
            });
    }

});
</script>

{% endblock %}
