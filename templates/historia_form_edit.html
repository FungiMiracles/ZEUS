{% extends "base_layout.html" %}
{% block title %}Edytuj wydarzenie{% endblock %}

{% block content %}

<style>
/* ============================================================
   ZEUS — EDYCJA WYDARZENIA HISTORYCZNEGO
============================================================ */

.historia-edit-wrapper {
    max-width: 900px;
    margin: 30px auto;
    font-family: "Segoe UI", Tahoma, sans-serif;
}

/* ===== TYTUŁ ===== */

.historia-edit-title {
    font-size: 1.6em;
    font-weight: 800;
    color: #2c3e50;
    margin-bottom: 18px;
}

/* ===== SEKCJE ===== */

.historia-section {
    background: #f4f6f8;
    border: 1px solid #d3d7dc;
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 22px;
}

.historia-section h3 {
    font-size: 1.05em;
    font-weight: 800;
    color: #34495e;
    margin-bottom: 14px;
}

/* ===== POLA ===== */

.historia-field {
    margin-bottom: 14px;
}

.historia-field label {
    display: block;
    font-weight: 700;
    font-size: 0.85em;
    color: #2c3e50;
    margin-bottom: 4px;
}

.historia-field input,
.historia-field select,
.historia-field textarea {
    width: 100%;
    padding: 9px 11px;
    border-radius: 6px;
    border: 1px solid #b4b9be;
    font-size: 0.95em;
    font-weight: 600;
}

.historia-field textarea {
    resize: vertical;
    
}

/* ===== AKCJE ===== */

.historia-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 26px;
}

.historia-actions .right {
    display: flex;
    gap: 10px;
}

/* ===== PRZYCISKI ZEUS ===== */

.btn-zeus {
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 0.9em;
    font-weight: 700;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s ease;
}

/* Anuluj */
.btn-cancel {
    background-color: #eaeaea;
    color: #34495e;
    border: 1.5px solid #bdc3c7;
}
.btn-cancel:hover {
   background-color: #999999;
}

/* Zapisz */
.btn-save {
    background-color: #3498db;
    color: white;
}
.btn-save:hover {
    background-color: #1d6da3;
}
</style>

<div class="historia-edit-wrapper">

    <!-- ===== TYTUŁ ===== -->
    <div class="historia-edit-title">
        Edytuj wydarzenie historyczne
    </div>

    <form method="POST">

        <!-- ===== PODSTAWOWE INFORMACJE ===== -->
        <div class="historia-section">
             <h3>Lokalizacja</h3>
         
             <!-- KONTYNENT -->
             <div class="historia-field">
                 <label>Kontynent</label>
                 <select name="kontynent">
                     <option value="">— brak —</option>
                     {% for k in ["Kao","Beifa","Anzinia","Peryfa","Wyspy Większe","Wyspy Mniejsze"] %}
                         <option value="{{ k }}" {% if h.kontynent == k %}selected{% endif %}>
                             {{ k }}
                         </option>
                     {% endfor %}
                 </select>
             </div>
         
             <!-- PAŃSTWO -->
             <div class="historia-field">
                 <label>Państwo</label>
                 <select name="panstwo_id">
                     <option value="">— brak —</option>
                     {% for p in panstwa %}
                         <option value="{{ p.PANSTWO_ID }}"
                                 {% if h.panstwo_id == p.PANSTWO_ID %}selected{% endif %}>
                             {{ p.panstwo_nazwa }}
                         </option>
                     {% endfor %}
                 </select>
             </div>
         
             <!-- REGION -->
             <div class="historia-field">
                 <label>Region</label>
                 <select name="region_id">
                     <option value="">— brak —</option>
                     {% for r in regiony %}
                         <option value="{{ r.region_id }}"
                                 {% if h.region_id == r.region_id %}selected{% endif %}>
                             {{ r.region_nazwa }}
                         </option>
                     {% endfor %}
                 </select>
             </div>
         
             <!-- MIASTO -->
             <div class="historia-field">
                 <label>Miasto</label>
                 <select name="miasto_id">
                     <option value="">— brak —</option>
                     {% for m in miasta %}
                         <option value="{{ m.miasto_id }}"
                                 {% if h.miasto_id == m.miasto_id %}selected{% endif %}>
                             {{ m.miasto_nazwa }}
                         </option>
                     {% endfor %}
                 </select>
             </div>
         </div>

    </form>

</div>

{% endblock %}
