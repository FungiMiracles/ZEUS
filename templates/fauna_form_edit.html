{% extends "base_layout.html" %}
{% block title %}Edycja zwierzęcia{% endblock %}

{% block content %}

<style>
.form-box {
    max-width: 900px;
    margin: 20px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    border: 1px solid #d3d6da;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.form-box h2 {
    margin-bottom: 15px;
    color: #34495e;
    text-align: center;
}

/* ===== FORM ===== */
.form-group {
    margin-bottom: 15px;
}

.form-group label {
    font-weight: 600;
    display: block;
    margin-bottom: 5px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #bfc5cc;
    font-family: inherit;
}

textarea {
    min-height: 100px;
}

/* ===== LISTA (POPRAWIONA) ===== */
.list-compact {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 2px 0;
}

.list-item {
    display: flex;
    align-items: center;     /* 🔥 kluczowe */
    gap: 8px;
    padding: 2px 4px;
    line-height: 1.2;
    border-radius: 4px;
    cursor: pointer;
}

.list-item:hover {
    background: #f2f5ff;
}

.list-item input[type="checkbox"] {
    margin-right: 8px !important;
    margin-left: 0 !important;
    width: auto !important;
    display: inline-block !important;
}

/* ===== OBRAZ ===== */
.preview {
    text-align: center;
    margin-bottom: 10px;
}

.preview img {
    max-width: 140px;
    border-radius: 6px;
    border: 1px solid #d3d6da;
}

/* ===== BUTTONY (ZEUS STANDARD) ===== */
.actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

.btn-zeus {
    font-weight: 600;
    font-family: inherit;
    font-size: 0.95em;

    padding: 6px 10px;
    border-radius: 6px;

    color: #fff;
    text-decoration: none;

    border: none;
    cursor: pointer;

    display: inline-block;

    transition: background 0.2s ease;
}

.btn-save { background-color: #27ae60; text-decoration: none !important; color: #ffffff;} 
.btn-save:hover { background-color: #1e8749; text-decoration: none !important; color: #ffffff;}

.btn-cancel { background-color: #c73424; text-decoration: none !important; color: #ffffff;}
.btn-cancel:hover { background-color: #96271b; text-decoration: none !important; color: #ffffff;}

/* klik */
.btn-save:active,
.btn-cancel:active {
    transform: scale(0.97);
}

.label-text {
    display: inline-block;
    line-height: 1.2;
}

.region-flash-item {
    max-width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    font-weight: 600;
}

.region-flash-item.success {
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}

.region-flash-item.error {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}

.region-flash-item.warning {
    background-color: #fff3cd;
    color: #856404;
    border: 1px solid #ffeeba;
}

.region-flash-item.info {
    background-color: #d1ecf1;
    color: #0c5460;
    border: 1px solid #bee5eb;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {

    .form-box {
        margin: 10px;
        padding: 15px;
    }

    .actions {
        flex-direction: column;
    }

    .btn-save,
    .btn-cancel {
        width: 100%;
        text-align: center;
    }

    .form-group input,
    .form-group textarea {
        font-size: 16px;
    }
}
</style>

<div class="form-box">

    <h2>Edycja zwierzęcia</h2>

    <form method="POST" enctype="multipart/form-data">

        <!-- NAZWA -->
        <div class="form-group">
            <label>Nazwa *</label>
            <input name="nazwa" value="{{ fauna.nazwa }}" required>
        </div>

        <!-- OPIS -->
        <div class="form-group">
            <label>Opis *</label>
            <textarea name="opis" required>{{ fauna.opis }}</textarea>
        </div>

        <!-- KONTYNENTY -->
        <div class="form-group">
            <label>Kontynenty</label>

            <div class="list-compact">
                {% for k in kontynenty %}
                    <label class="list-item">
                        <input type="checkbox"
                               name="kontynent_id"
                               value="{{ k.kontynent_id }}"
                               {% if k.kontynent_id in selected_kontynenty %}checked{% endif %}>
                        <span>{{ k.kontynent_nazwa }}</span>
                    </label>
                {% endfor %}
            </div>
        </div>

        <!-- PAŃSTWA -->
        <div class="form-group">
            <label>Państwa</label>
            <div id="panstwa-box" class="list-compact"></div>
        </div>

        <!-- OBRAZ -->
        <div class="form-group">
            <label>Obraz</label>

            {% if fauna.fauna_obraz %}
                <div class="preview">
                    <img src="/fauna/{{ fauna.fauna_id }}/image">
                </div>
            {% endif %}

            <input type="file" name="obraz" accept="image/png, image/jpeg">
        </div>

        <!-- ACTIONS -->
        <div class="actions">
            <button type="submit" class="btn-zeus btn-save">Zapisz</button>
            <a href="/fauna" class="btn-zeus btn-cancel">Anuluj</a>
        </div>

    </form>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const selectedPanstwa = {{ selected_panstwa | tojson | safe }};
    const panstwaBox = document.getElementById("panstwa-box");
    const kontynenty = document.querySelectorAll("input[name='kontynent_id']");

    function loadAllPanstwa() {

        const checked = Array.from(kontynenty)
            .filter(c => c.checked)
            .map(c => c.value);

        if (!checked.length) {
            panstwaBox.innerHTML = "<span class='placeholder'>Wybierz kontynenty</span>";
            return;
        }

        Promise.all(
            checked.map(id =>
                fetch(`/api/panstwa_by_kontynent?kontynent_id=${id}`)
                    .then(r => r.json())
            )
        ).then(results => {

            panstwaBox.innerHTML = "";

            const merged = [].concat(...results);
            const unique = [];
            const ids = new Set();

            merged.forEach(p => {
                if (!ids.has(p.id)) {
                    ids.add(p.id);
                    unique.push(p);
                }
            });

            unique.forEach(p => {

                const label = document.createElement("label");
                label.className = "list-item";

                const input = document.createElement("input");
                input.type = "checkbox";
                input.name = "panstwo_id";
                input.value = p.id;

                if (selectedPanstwa.map(Number).includes(Number(p.id))) {
                    input.checked = true;
                }

                label.appendChild(input);
                const text = document.createElement("span");
                text.className = "label-text";
                text.textContent = p.nazwa;

                label.appendChild(text);

                panstwaBox.appendChild(label);
            });

        });
    }

    kontynenty.forEach(c => {
        c.addEventListener("change", loadAllPanstwa);
    });

    loadAllPanstwa();
});
</script>

{% endblock %}
