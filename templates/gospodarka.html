{% extends 'base_layout.html' %}
{% block title %}Gospodarka{% endblock %}

{% block content %}
<style>
    .module-header { text-align: center; margin-bottom: 40px; }
    .module-header h2 { font-weight: 800; color: var(--zeus-dark); letter-spacing: -1px; }
    .module-header p { color: #64748b; font-size: 1rem; }

    .zeus-grid-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        padding: 10px;
    }

    .tile-card {
        background: #ffffff;
        border: 1px solid #e1e5ea;
        border-radius: 16px;
        padding: 30px 20px;
        text-align: center;
        text-decoration: none !important;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: 0.3s;
    }

    .tile-card i {
        font-size: 2.5rem;
        color: #2c73d2;
        margin-bottom: 15px;
    }

    .tile-card:hover {
        transform: translateY(-5px);
        border-color: #2c73d2;
        box-shadow: 0 12px 20px -5px rgba(44,115,210,0.2);
    }

    .tile-card span {
        font-size: 0.85rem;
        color: #94a3b8;
    }
</style>

<div class="module-header">
    <h2><i class="fas fa-chart-line mr-2"></i> Gospodarka</h2>
    <p>Dane ekonomiczne, rozwój i analiza państw.</p>
</div>

<div class="zeus-grid-tiles">

    <a href="{{ url_for('gospodarka_list') }}" class="tile-card">
        <i class="fas fa-coins"></i>
        <h5>Dane gospodarcze</h5>
        <span>Przegląd wskaźników ekonomicznych państw.</span>
    </a>

    <a href="{{ url_for('gospodarka_list') }}" class="tile-card">
        <i class="fas fa-balance-scale"></i>
        <h5>Porównanie</h5>
        <span>Analiza i zestawienie gospodarek.</span>
    </a>

</div>

{% endblock %}
