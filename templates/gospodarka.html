{% extends 'base_layout.html' %}
{% block title %}Gospodarka{% endblock %}
{% block content %}
<style>
    .gosp-header { text-align: center; margin: 20px 0 40px; }
    .gosp-header h2 { font-weight: 800; color: #2c73d2; }
    .gosp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
    .gosp-card {
        background: white; border-radius: 20px; padding: 40px; text-align: center;
        text-decoration: none !important; border: 1px solid #e2e8f0; transition: 0.3s;
        display: flex; flex-direction: column; align-items: center;
    }
    .gosp-card i { font-size: 3rem; color: #2c73d2; margin-bottom: 15px; }
    .gosp-card h5 { color: #1e293b; font-weight: 700; }
    .gosp-card:hover { background: #f8faff; border-color: #2c73d2; box-shadow: 0 12px 20px rgba(44, 115, 210, 0.1); }
</style>
<div class="gosp-header"><h2><i class="fas fa-chart-line mr-2"></i> Gospodarka i Handel</h2></div>
<div class="gosp-grid">
    <a href="{{ url_for('gospodarka_lista') }}" class="gosp-card">
        <i class="fas fa-coins"></i>
        <h5>Zasoby i Finanse</h5>
    </a>
    <a href="{{ url_for('gospodarka_handel') }}" class="gosp-card">
        <i class="fas fa-shuttle-van"></i>
        <h5>Handel Międzynarodowy</h5>
    </a>
</div>
{% endblock %}
