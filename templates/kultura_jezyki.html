{% extends "base_layout.html" %}

{% block title %}
Kultura — Języki
{% endblock %}

{% block content %}

<style>
/* ============================================================
   ZEUS — KULTURA: JĘZYKI (ETAP 0)
============================================================ */

.kultura-jezyki {
    max-width: 1200px;
    margin: 25px auto 40px auto;
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: #2c3e50;
}

.kultura-jezyki .page-header {
    text-align: center;
    margin-bottom: 30px;
}

.kultura-jezyki .page-header h1 {
    font-size: 1.8em;
    font-weight: 800;
    margin-bottom: 8px;
}

.kultura-jezyki .page-header p {
    font-size: 0.95em;
    color: #555;
}

.kultura-jezyki .filter-box {
    background: #ffffff;
    border: 1px solid #d3d7dc;
    border-radius: 12px;
    padding: 18px 22px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    margin-bottom: 25px;
}

.kultura-jezyki .actions {
    text-align: right;
    margin-bottom: 20px;
}

.kultura-jezyki .results-box {
    background: #ffffff;
    border: 1px solid #d3d7dc;
    border-radius: 12px;
    padding: 25px;
    min-height: 120px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    text-align: center;
    color: #777;
    font-weight: 600;
}
</style>

<div class="kultura-jezyki">

    <!-- ===== HEADER ===== -->
    <div class="page-header">
        <h1>Języki</h1>
        <p>Moduł językowy świata Entendy</p>
    </div>

    <!-- ===== FILTRY ===== -->
    <div class="filter-box">

    <form id="jezyki-filter-form">

              <div style="
                  display: grid;
                  grid-template-columns: repeat(3, 1fr);
                  gap: 18px;
                  align-items: end;
              ">
      
                  <!-- KONTYNENT -->
                  <div>
                      <label for="filter-kontynent"><strong>Kontynent</strong></label>
                      <select id="filter-kontynent" name="kontynent" class="form-control">
                          <option value="">— wszystkie kontynenty —</option>
                          <option value="Kao">Kao</option>
                          <option value="Beifa">Beifa</option>
                          <option value="Anzinia">Anzinia</option>
                          <option value="Peryfa">Peryfa</option>
                          <option value="Wyspy Większe">Wyspy Większe</option>
                          <option value="Wyspy Mniejsze">Wyspy Mniejsze</option>
                      </select>
                  </div>
      
                  <!-- PAŃSTWO -->
                  <div>
                      <label for="filter-panstwo"><strong>Państwo</strong></label>
                      <select id="filter-panstwo" name="panstwo" class="form-control" disabled>
                          <option value="">— wybierz kontynent —</option>
                      </select>
                  </div>
      
                  <!-- JĘZYK -->
                  <div>
                      <label for="filter-jezyk"><strong>Język</strong></label>
                      <select id="filter-jezyk" name="jezyk" class="form-control">
                          <option value="">— wszystkie języki —</option>
                          <!-- docelowo: jezyki z bazy -->
                      </select>
                  </div>
      
              </div>
      
              <!-- AKCJE -->
              <div style="margin-top: 20px; text-align: center;">
                  <button type="submit" class="btn btn-primary">
                      Szukaj
                  </button>
              </div>
      
          </form>
      
      </div>

    <!-- ===== AKCJE ===== -->
    <div class="actions">
        <a href="{{ url_for('kultura_jezyk_add') }}" class="btn btn-success">
            Dodaj nowy język
        </a>
    </div>

   <div class="actions">
        <a href="{{ url_for('kultura_jezyk_przypisz') }}" class="btn btn-success">
            Przypisz język do państwa
        </a>
    </div>

    <!-- ===== WYNIKI ===== -->
    <div class="results-box">
        Wybierz kryteria wyszukiwania, aby wyświetlić języki.
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const kontynentSelect = document.getElementById("filter-kontynent");
    const panstwoSelect   = document.getElementById("filter-panstwo");
    const jezykSelect     = document.getElementById("filter-jezyk");

    // ===============================
    // KONTYNENT → PAŃSTWO
    // ===============================

    kontynentSelect.addEventListener("change", function () {
        const kontynent = this.value;

        panstwoSelect.innerHTML = "";

        if (!kontynent) {
            panstwoSelect.disabled = true;
            panstwoSelect.innerHTML = "<option value=''>— wybierz kontynent —</option>";
            return;
        }

        panstwoSelect.disabled = true;
        panstwoSelect.innerHTML = "<option value=''>Ładowanie państw...</option>";

        fetch(`/api/kultura/panstwa_by_kontynent?kontynent=${encodeURIComponent(kontynent)}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Błąd pobierania państw");
                }
                return response.json();
            })
            .then(data => {
                panstwoSelect.disabled = false;
                panstwoSelect.innerHTML = "<option value=''>— wszystkie państwa —</option>";

                data.forEach(p => {
                    const opt = document.createElement("option");
                    opt.value = p.id;
                    opt.textContent = p.nazwa;
                    panstwoSelect.appendChild(opt);
                });
            })
            .catch(err => {
                console.error(err);
                panstwoSelect.innerHTML = "<option value=''>Błąd ładowania</option>";
            });
    });

    // ===============================
    // LISTA JĘZYKÓW (ON LOAD)
    // ===============================

    fetch("/api/kultura/jezyki")
        .then(response => {
            if (!response.ok) {
                throw new Error("Błąd pobierania języków");
            }
            return response.json();
        })
        .then(data => {
            data.forEach(j => {
                const opt = document.createElement("option");
                opt.value = j.id;
                opt.textContent = j.nazwa;
                jezykSelect.appendChild(opt);
            });
        })
        .catch(err => {
            console.error(err);
            jezykSelect.innerHTML = "<option value=''>Błąd ładowania języków</option>";
        });

});
</script>

{% endblock %}
