{% extends 'base_layout.html' %}
{% block title %}Dyplomacja{% endblock %}
{% block content %}
<style>
    .dyp-header { text-align: center; margin: 20px 0 40px; }
    .dyp-header h2 { font-weight: 800; color: #e67e22; text-transform: uppercase; }
    
    .dyp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
    .dyp-card {
        background: #fff; border: 1px solid #eee; border-radius: 16px; padding: 40px 20px;
        text-align: center; text-decoration: none !important; transition: 0.3s;
        display: flex; flex-direction: column; align-items: center; border-bottom: 4px solid #f39c12;
    }
    .dyp-card i { font-size: 3rem; color: #f39c12; margin-bottom: 20px; }
    .dyp-card h5 { color: #2c3e50; font-weight: 700; margin: 0; }
    .dyp-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(243, 156, 18, 0.15); background: #fffaf5; }
</style>

<div class="dyp-header">
    <h2><i class="fas fa-handshake mr-2"></i> Dyplomacja</h2>
</div>

<div class="dyp-grid">
    <a href="{{ url_for('organizacje_list') }}" class="dyp-card">
        <i class="fas fa-globe"></i>
        <h5>Organizacje międzynarodowe</h5>
    </a>
    <a href="{{ url_for('relacje_list') }}" class="dyp-card">
        <i class="fas fa-exchange-alt"></i>
        <h5>Relacje dyplomatyczne</h5>
    </a>
    <a href="{{ url_for('wojny_list') }}" class="dyp-card">
        <i class="fas fa-skull-crossbones"></i>
        <h5>Konflikty i wojny</h5>
    </a>
</div>
{% endblock %}
