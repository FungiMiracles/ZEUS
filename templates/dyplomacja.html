{% extends 'base_layout.html' %}
{% block title %}Dyplomacja{% endblock %}

{% block content %}
<style>
    .module-header { text-align: center; margin-bottom: 40px; }
    .module-header h2 { font-weight: 800; color: var(--zeus-dark); }

    .zeus-grid-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        padding: 10px;
    }

    .tile-card {
        background: #ffffff;
        border: 1px solid #e1e5ea;
        border-radius: 16px;
        padding: 30px 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .tile-card i {
        font-size: 2.5rem;
        color: #ff8c2b;
        margin-bottom: 15px;
    }

    .tile-card:hover {
        transform: translateY(-5px);
        border-color: #ff8c2b;
        box-shadow: 0 12px 20px -5px rgba(255,140,43,0.25);
    }

    .tile-locked {
        background: #f8fafc;
        opacity: 0.7;
        cursor: not-allowed;
    }
</style>

<div class="module-header">
    <h2><i class="fas fa-globe-europe mr-2"></i> Dyplomacja</h2>
    <p>Relacje międzynarodowe, sojusze i konflikty.</p>
</div>

<div class="zeus-grid-tiles">

    <a href="{{ url_for('dyplomacja_list') }}" class="tile-card">
        <i class="fas fa-globe"></i>
        <h5>Relacje międzynarodowe</h5>
    </a>

    <a href="{{ url_for('dyplomacja_sojusze') }}" class="tile-card">
        <i class="fas fa-handshake"></i>
        <h5>Sojusze</h5>
    </a>

    <div class="tile-card tile-locked" onclick="zeusToast('Moduł w budowie')">
        <i class="fas fa-landmark"></i>
        <h5>Organizacje</h5>
    </div>

    <div class="tile-card tile-locked" onclick="zeusToast('Moduł w budowie')">
        <i class="fas fa-fist-raised"></i>
        <h5>Konflikty</h5>
    </div>

</div>

{% endblock %}
