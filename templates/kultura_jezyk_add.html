{% extends "base_layout.html" %}

{% block title %}
Kultura — Dodaj język
{% endblock %}

{% block content %}

<style>
/* ============================================================
   ZEUS — KULTURA: DODAJ JĘZYK
============================================================ */

.jezyk-add {
    max-width: 900px;
    margin: 25px auto 40px auto;
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: #2c3e50;
}

.jezyk-add .header {
    text-align: center;
    margin-bottom: 30px;
}

.jezyk-add h1 {
    font-size: 1.8em;
    font-weight: 800;
}

.form-box {
    background: #ffffff;
    border: 1px solid #d3d7dc;
    border-radius: 12px;
    padding: 25px 30px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}

.form-row {
    margin-bottom: 18px;
}

.form-row label {
    font-weight: 700;
    margin-bottom: 6px;
    display: block;
}

.form-row input,
.form-row textarea {
    width: 100%;
    padding: 9px 11px;
    border-radius: 6px;
    border: 1px solid #b4b9be;
    font-family: inherit;
}

.form-row textarea {
    resize: vertical;
    min-height: 90px;
}

.form-actions {
    margin-top: 30px;
    text-align: center;
}

.btn-zeus {
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 0.9em;
    font-weight: 700;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s ease;
}

.btn-cancel {
    background-color: #c73424;
    color: #ffffff;
}

.btn-cancel:hover {
    background-color: #96271b;
    color: #ffffff;
    text-decoration: none !important;
}

.btn-add-inline {
    margin-top: 8px;
}

.btn-add { background-color: #27ae60; color:#ffffff; }
.btn-add:hover { background-color: #1e8749; color:#ffffff; }

.form-row select {
    width: 100%;
    padding: 9px 11px;
    border-radius: 6px;
    border: 1px solid #b4b9be;
    font-family: inherit;
    background-color: #ffffff;
}

.row-inline {
    display: flex;
    gap: 10px;
}

.row-inline select {
    flex: 1;
}

.row-inline button {
    white-space: nowrap;
}

.modal-hidden {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.modal-box {
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    width: 320px;
}

.modal-box input {
    width: 100%;
    padding: 8px;
    margin: 12px 0;
}

.modal-actions {
    display: flex;
    justify-content: space-between;
}

.btn-primary {
    background: #2c73d2;
    color: #ffffff;
}

.btn-primary:hover {
    background: #1f5bb0;
}

.form-row label {
    display: block;
    margin-bottom: 6px;
}

.row-inline {
    display: flex;
    gap: 10px;
    align-items: stretch;
}

.row-inline button {
    height: 100%;
}
/* ============================================================
   ZEUS — KULTURA: DODAJ JĘZYK (MOBILE)
============================================================ */

@media (max-width: 768px) {

    .jezyk-add {
        margin: 15px 10px 30px 10px;
    }

    /* ===== HEADER ===== */

    .jezyk-add .header {
        margin-bottom: 22px;
    }

    .jezyk-add h1 {
        font-size: 1.45em;
    }

    /* ===== FORM BOX ===== */

    .form-box {
        padding: 18px 16px;
    }

    /* ===== FORM ROWS ===== */

    .form-row {
        margin-bottom: 14px;
    }

    .form-row label {
        font-size: 0.9em;
        margin-bottom: 4px;
    }

    .form-row input,
    .form-row textarea {
        font-size: 1em;
        padding: 10px 10px;
    }

    .form-row textarea {
        min-height: 110px;
    }

    /* ===== ACTIONS ===== */

    .form-actions {
        margin-top: 22px;
    }

    .form-actions .btn {
        width: 100%;
        padding: 10px 0;
        font-size: 1em;
    }

    .form-actions .btn + .btn {
        margin-top: 10px;
    }

    .row-inline {
        flex-direction: column;
    }

    .row-inline button {
        width: 100%;
    }
}

</style>

<div class="jezyk-add">

    <div class="header">
        <h1>Dodaj nowy język</h1>
    </div>

    <div class="form-box">

        <form method="POST">

            <!-- NAZWA -->
            <div class="form-row">
                <label>Nazwa języka *</label>
                <input name="jezyk_nazwa" required>
            </div>

            <!-- KOD -->
            <div class="form-row">
                <label>Kod języka (2 litery)</label>
                <input name="jezyk_kod" maxlength="2" style="text-transform: uppercase;">
            </div>

            <div class="form-row">
                <label for="jezykRodzinaSelect">Rodzina językowa *</label>

                <select name="jezyk_rodzina_id" id="jezykRodzinaSelect" required>
                    <option value="">— wybierz —</option>
                    {% for r in rodziny %}
                        <option value="{{ r.jezyk_rodzina_id }}">
                            {{ r.nazwa }}
                        </option>
                    {% endfor %}
                </select>

                <button type="button" class="btn-zeus btn-add btn-add-inline" id="addRodzinaBtn">
                    + Dodaj rodzinę
                </button>
            </div>

            <!-- PRZYKŁAD PL -->
            <div class="form-row">
                <label>Przykład w języku polskim</label>
                <textarea name="przyklad_polski"></textarea>
            </div>

            <!-- PRZYKŁAD DOCELOWY -->
            <div class="form-row">
                <label>Przykład w języku docelowym</label>
                <textarea name="przyklad_docelowy"></textarea>
            </div>

            <!-- OPIS -->
            <div class="form-row">
                <label>Opis języka</label>
                <textarea name="opis" style="min-height: 140px;"></textarea>
            </div>

            <!-- AKCJE -->
            <div class="form-actions">
                <button type="submit" class="btn-zeus btn-success">
                    Zapisz język
                </button>
                <a href="{{ url_for('kultura_jezyki') }}" class="btn-zeus btn-cancel">
                    Anuluj
                </a>
            </div>

        </form>

    </div>
    <div id="rodzinaModal" class="modal-hidden">
        <div class="modal-box">
            <h3>Dodaj rodzinę językową</h3>

            <input type="text" id="nowaRodzinaInput" placeholder="Nazwa rodziny">

            <div class="modal-actions">
                <button class="btn-zeus btn-success" id="saveRodzinaBtn">
                    Zapisz
                </button>
                <button class="btn-zeus btn-cancel" id="closeModalBtn">
                    Anuluj
                </button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const modal = document.getElementById("rodzinaModal");
    const openBtn = document.getElementById("addRodzinaBtn");
    const closeBtn = document.getElementById("closeModalBtn");
    const saveBtn = document.getElementById("saveRodzinaBtn");
    const input = document.getElementById("nowaRodzinaInput");
    const select = document.getElementById("jezykRodzinaSelect");

    openBtn.addEventListener("click", () => {
        modal.style.display = "flex";
        input.value = "";
    });

    closeBtn.addEventListener("click", () => {
        modal.style.display = "none";
    });

    saveBtn.addEventListener("click", () => {
        const nazwa = input.value.trim();

        if (!nazwa) {
            alert("Podaj nazwę");
            return;
        }

        fetch("/api/kultura/dodaj_rodzine", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ nazwa })
        })
        .then(r => r.json())
        .then(data => {
            if (!data.success) {
                alert(data.error || "Błąd");
                return;
            }

            // dodanie do selecta
            const opt = document.createElement("option");
            opt.value = data.id;
            opt.textContent = data.nazwa;
            opt.selected = true;

            select.appendChild(opt);

            modal.style.display = "none";
        })
        .catch(() => alert("Błąd zapisu"));
    });

});
</script>

{% endblock %}
