{% extends "base_layout.html" %}

{% block title %}
Kultura — Dodaj język
{% endblock %}

{% block content %}

<style>
/* ============================================================
   ZEUS — KULTURA: DODAJ JĘZYK
============================================================ */

.jezyk-add {
    max-width: 900px;
    margin: 25px auto 40px auto;
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: #2c3e50;
}

.jezyk-add .header {
    text-align: center;
    margin-bottom: 30px;
}

.jezyk-add h1 {
    font-size: 1.8em;
    font-weight: 800;
}

.form-box {
    background: #ffffff;
    border: 1px solid #d3d7dc;
    border-radius: 12px;
    padding: 25px 30px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}

.form-row {
    margin-bottom: 18px;
}

.form-row label {
    font-weight: 700;
    margin-bottom: 6px;
    display: block;
}

.form-row input,
.form-row textarea {
    width: 100%;
    padding: 9px 11px;
    border-radius: 6px;
    border: 1px solid #b4b9be;
    font-family: inherit;
}

.form-row textarea {
    resize: vertical;
    min-height: 90px;
}

.form-actions {
    margin-top: 30px;
    text-align: center;
}

@media (max-width: 768px) {

    .kultura-jezyki {
        margin: 15px 10px 30px 10px;
    }

    /* ===== HEADER ===== */

    .page-header h1 {
        font-size: 1.45em;
    }

    .page-header p {
        font-size: 0.9em;
    }

    /* ===== FILTRY ===== */

    .filter-box {
        padding: 16px 16px;
    }

    .filters-grid {
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .filters-grid label {
        margin-bottom: 4px;
    }

    .filter-actions {
        margin-top: 16px;
    }

    .filter-actions .btn {
        width: 100%;
        padding: 10px 0;
        font-size: 1em;
    }

    /* ===== ACTIONS ===== */

    .actions {
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
    }

    .actions .btn {
        width: 100%;
        padding: 10px 0;
        font-size: 1em;
    }

    /* ===== WYNIKI ===== */

    .results-box {
        padding: 18px 16px;
    }

    .language-card h3 {
        font-size: 1.1em;
    }

    .language-card p {
        font-size: 0.95em;
        line-height: 1.45;
    }

    /* ===== TABELA ===== */

    .lang-table th,
    .lang-table td {
        padding: 8px 9px;
        font-size: 0.9em;
    }

    .lang-table th {
        font-weight: 700;
    }
}
</style>

<div class="jezyk-add">

    <div class="header">
        <h1>Dodaj nowy język</h1>
    </div>

    <div class="form-box">

        <form method="POST">

            <!-- NAZWA -->
            <div class="form-row">
                <label>Nazwa języka *</label>
                <input name="jezyk_nazwa" required>
            </div>

            <!-- KOD -->
            <div class="form-row">
                <label>Kod języka (2 litery)</label>
                <input name="jezyk_kod" maxlength="2" style="text-transform: uppercase;">
            </div>

            <!-- PRZYKŁAD PL -->
            <div class="form-row">
                <label>Przykład w języku polskim</label>
                <textarea name="przyklad_polski"></textarea>
            </div>

            <!-- PRZYKŁAD DOCELOWY -->
            <div class="form-row">
                <label>Przykład w języku docelowym</label>
                <textarea name="przyklad_docelowy"></textarea>
            </div>

            <!-- OPIS -->
            <div class="form-row">
                <label>Opis języka</label>
                <textarea name="opis" style="min-height: 140px;"></textarea>
            </div>

            <!-- AKCJE -->
            <div class="form-actions">
                <button type="submit" class="btn btn-success">
                    Zapisz język
                </button>
                <a href="{{ url_for('kultura_jezyki') }}" class="btn btn-secondary">
                    Anuluj
                </a>
            </div>

        </form>

    </div>

</div>

{% endblock %}
