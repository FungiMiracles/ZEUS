{% extends 'base_layout.html' %}
{% block title %}Dodaj państwo{% endblock %}

{% block content %}

<style>
/* ============================================================
   ZEUS — DODAWANIE PAŃSTWA (RESPONSYWNY FORMULARZ)
============================================================ */

.country-add {
    max-width: 1000px;
    margin: 30px auto;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    color: #2c3e50;
}

.country-add h1 {
    text-align: center;
    font-size: 1.9em;
    font-weight: 700;
    margin-bottom: 6px;
}

.country-add .subtitle {
    text-align: center;
    font-size: 1.1em;
    color: #179048;
    margin-bottom: 28px;
}

/* ===================== KARTA ===================== */

.form-card {
    background: #ffffff;
    border-radius: 14px;
    padding: 24px 28px;
    margin-bottom: 20px;
    border: 1px solid #d3d7dc;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

/* ===================== GRID (DESKTOP) ===================== */

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px 22px;
}

/* ===================== POLA ===================== */

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    font-weight: 700;
    margin-bottom: 6px;
    font-size: 0.9em;
}

.form-group input,
.form-group select {
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid #b4b9be;
    font-size: 15px;
}

.form-group input[type="file"] {
    padding: 6px 0;
    font-size: 14px;
}

.form-hint {
    font-size: 0.8em;
    color: #666;
    margin-top: 4px;
}

/* ===================== BŁĘDY ===================== */

.form-error {
    background: #ffe5e5;
    border: 1px solid #cc0000;
    color: #900;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-weight: 600;
}

/* ===================== AKCJE ===================== */

.form-actions {
    text-align: center;
    margin-top: 30px;
}

.form-actions button,
.form-actions a {
    padding: 11px 28px;
    font-weight: 600;
    border-radius: 8px;
    text-decoration: none;
    cursor: pointer;
    display: inline-block;
    transition: background-color 0.25s;
}

.form-actions button {
    background: #5d7dce;
    color: #fff;
    border: none;
}

.form-actions button:hover {
    background: #4171d1;
}

.form-actions a {
    background: #c0392b;
    color: #fff;
    margin-left: 10px;
}

.form-actions a:hover {
    background: #96281b;
}

/* ===================== MOBILE ===================== */

@media (max-width: 767px) {

    .country-add {
        margin: 18px 10px;
    }

    .country-add h1 {
        font-size: 1.6em;
    }

    .country-add .subtitle {
        font-size: 1em;
        margin-bottom: 22px;
    }

    .form-card {
        padding: 18px 16px;
    }

    .form-grid {
        grid-template-columns: 1fr;
        gap: 16px;
    }

    .form-group input,
    .form-group select {
        font-size: 16px; /* anti-zoom iOS */
        padding: 10px 12px;
    }

    .form-actions button,
    .form-actions a {
        display: block;
        width: 100%;
        margin: 8px 0;
        font-size: 15px;
    }

    .form-actions a {
        margin-left: 0;
    }

   /* ============================================================
   CRITICAL MOBILE FIX — OVERFLOW INPUTS
============================================================ */

   *, *::before, *::after {
       box-sizing: border-box;
   }
   
   .form-group,
   .form-card,
   .country-add,
   .region-add {
       max-width: 100%;
       overflow-x: hidden;
   }
   
   .form-group input,
   .form-group select,
   .form-group textarea {
       width: 100%;
       max-width: 100%;
       box-sizing: border-box;
   }

}
</style>

<div class="country-add">

    <h1>Dodaj nowe państwo</h1>
    <div class="subtitle">
        Uzupełnij wszystkie pola oraz dodaj flagę i mapę państwa.
    </div>

    {% if error %}
        <div class="form-error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">

        <div class="form-card">
            <div class="form-grid">

                <div class="form-group">
                    <label>Flaga państwa</label>
                    <input type="file" name="flaga" accept=".jpg,.jpeg,.png">
                </div>

                <div class="form-group">
                    <label>Mapa państwa</label>
                    <input type="file" name="mapa" accept=".jpg,.jpeg,.png">
                </div>

                <div class="form-group">
                    <label>Nazwa państwa</label>
                    <input type="text" name="panstwo_nazwa" required>
                </div>

                <div class="form-group">
                    <label>Pełna nazwa</label>
                    <input type="text" name="panstwo_pelna_nazwa">
                </div>

                <div class="form-group">
                    <label>Kod państwa (ECC)</label>
                    <input type="text" name="panstwo_kod" required>
                </div>

                <div class="form-group">
                    <label>Kontynent</label>
                    <select name="kontynent" required>
                        <option value="">— wybierz —</option>
                        <option>Kao</option>
                        <option>Beifa</option>
                        <option>Anzinia</option>
                        <option>Peryfa</option>
                        <option>Wyspy Większe</option>
                        <option>Wyspy Mniejsze</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Ustrój polityczny</label>
                    <input type="text" name="panstwo_ustroj">
                </div>

                <div class="form-group">
                    <label>Stolica</label>
                    <input type="text" name="panstwo_stolica">
                </div>

                <div class="form-group">
                    <label>Populacja</label>
                    <input type="number" name="panstwo_populacja">
                </div>

                <div class="form-group">
                    <label>Powierzchnia (km²)</label>
                    <input type="number" name="panstwo_powierzchnia">
                </div>

                <div class="form-group">
                    <label>Waluta</label>
                    <input type="text" name="panstwo_waluta">
                </div>

                <div class="form-group">
                    <label>Religia dominująca</label>
                    <input type="text" name="panstwo_religia">
                </div>

                <div class="form-group">
                    <label>PKB</label>
                    <input type="number" name="PKB">
                </div>

                <div class="form-group">
                    <label>PKB na mieszkańca</label>
                    <input type="number" name="PKB_per_capita">
                </div>

                <div class="form-group">
                    <label for="czy_suwerenny">
                        Status suwerenności <span style="color:#ff6a6a;">*</span>
                    </label>

                    <select name="czy_suwerenny" id="czy_suwerenny" required>
                        <option value="">— Wybierz —</option>
                        <option value="TAK"
                            {% if form_data.get('czy_suwerenny', panstwo.czy_suwerenny) == 'TAK' %}selected{% endif %}>
                            TAK
                        </option>
                        <option value="NIE"
                            {% if form_data.get('czy_suwerenny', panstwo.czy_suwerenny) == 'NIE' %}selected{% endif %}>
                            NIE
                        </option>
                    </select>
                </div>

            </div>
        </div>

        <div class="form-actions">
            <button type="submit">Zapisz państwo</button>
            <a href="{{ url_for('home_page') }}">Anuluj</a>
        </div>

    </form>

</div>

{% endblock %}
