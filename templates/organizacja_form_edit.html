{% extends "base_layout.html" %}
{% block title %}Edycja organizacji{% endblock %}

{% block content %}

<style>
.org-container {
    max-width: 1000px;
    margin: 25px auto;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: #f4f6f8;
    padding-bottom: 40px;
}

.header {
    text-align: center;
    margin: 20px 0 30px 0;
}

.header h1 {
    font-size: 2em;
    font-weight: 700;
    color: #2c3e50;
}

/* BOX */
.section-box {
    background: #ffffff;
    padding: 20px 25px;
    border-radius: 12px;
    margin-bottom: 20px;
    border: 1px solid #d3d7dc;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}

.section-box h2 {
    font-size: 1.3em;
    margin-bottom: 15px;
    color: #34495e;
}

/* GRID */
.section-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px 20px;
}

/* INPUT / VALUE */
.section-grid label {
    font-weight: 700;
    font-size: 0.9em;
}

.section-grid input,
.section-grid select,
textarea {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #b4b9be;
    font-weight: 600;
}

.value-box {
    background: #eef1f7;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #c8ccd1;
    font-weight: 600;
}

/* FLAGI */
.flag-icon {
    width: 22px;
    height: 14px;
    object-fit: cover;
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: middle;
}

/* ALERTY */
.alert {
    max-width: 900px;
    margin: 10px auto;
    padding: 10px;
    border-radius: 6px;
    font-weight: 600;
}

.alert-success {
    background: #d4edda;
    color: #2e7d32;
}

.alert-error {
    background: #fdecea;
    color: #c0392b;
}

/* BUTTONY */
.action-row {
    text-align: center;
    margin-top: 20px;
}

.btn {
    padding: 10px 18px;
    border-radius: 6px;
    font-weight: 600;
    border: none;
    cursor: pointer;
}

.btn-primary { background: #2d76c9; color: white; }
.btn-primary:hover { background: #154e91; }

.btn-secondary {
    background: #af1515;
    border: 1px solid #af1515;
}

.btn-secondary:hover {
    background: #600101;
    color: #600101;
}
</style>

<div class="org-container">

    <div class="header">
        <h1>Edytuj organizację</h1>
    </div>

    <form method="POST">

        <div class="section-box">
            <h2>Dane podstawowe</h2>

            <div class="section-grid">

                <div>
                    <label>Nazwa</label>
                    <input name="org_nazwa" value="{{ org.org_nazwa }}">
                </div>

                <div>
                    <label>Skrót</label>
                    <input name="org_skrot" value="{{ org.org_skrot }}">
                </div>

                <div>
                    <label>Typ</label>
                    <input name="org_typ" value="{{ org.org_typ }}">
                </div>

                <div>
                    <label>Status</label>
                    <select name="czy_aktywna">
                        <option value="1" {% if org.czy_aktywna %}selected{% endif %}>AKTYWNA</option>
                        <option value="0" {% if not org.czy_aktywna %}selected{% endif %}>NIEAKTYWNA</option>
                    </select>
                </div>

            </div>
        </div>

        <div class="section-box">
            <h2>Opis</h2>
            <textarea name="org_opis">{{ org.org_opis }}</textarea>
        </div>

        <div class="action-row">
            <button type="submit" class="btn btn-primary">Zapisz</button>
            <a href="/dyplomacja/organizacje">
                <button type="button" class="btn btn-secondary">Wróć</button>
            </a>
        </div>

    </form>

</div>

{% endblock %}
