{% extends "base_layout.html" %}
{% block title %}Edycja organizacji{% endblock %}

{% block content %}

<style>
.org-container {
    max-width: 1000px;
    margin: 25px auto;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: #f4f6f8;
    padding-bottom: 40px;
}

.header {
    text-align: center;
    margin: 20px 0 30px 0;
}

.header h1 {
    font-size: 2em;
    font-weight: 700;
    color: #2c3e50;
}

/* BOX */
.section-box {
    background: #ffffff;
    padding: 20px 25px;
    border-radius: 12px;
    margin-bottom: 20px;
    border: 1px solid #d3d7dc;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}

.section-box h2 {
    font-size: 1.3em;
    margin-bottom: 15px;
    color: #34495e;
}

/* GRID */
.section-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px 20px;
}

/* INPUT / VALUE */
.section-grid label {
    font-weight: 700;
    font-size: 0.9em;
}

.section-grid input,
.section-grid select,
textarea {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #b4b9be;
    font-weight: 600;
}

.value-box {
    background: #eef1f7;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #c8ccd1;
    font-weight: 600;
}

/* FLAGI */
.flag-icon {
    width: 22px;
    height: 14px;
    object-fit: cover;
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: middle;
}

/* ALERTY */
.alert {
    max-width: 900px;
    margin: 10px auto;
    padding: 10px;
    border-radius: 6px;
    font-weight: 600;
}

.alert-success {
    background: #d4edda;
    color: #2e7d32;
}

.alert-error {
    background: #fdecea;
    color: #c0392b;
}

/* BUTTONY */
.action-row {
    text-align: center;
    margin-top: 20px;
}

.btn-zeus {
    font-weight: 600;
    font-family: inherit;
    font-size: 0.95em;

    padding: 6px 10px;
    border-radius: 6px;

    color: #fff;
    text-decoration: none;

    border: none;
    cursor: pointer;

    display: inline-block;

    transition: background 0.2s ease;
}

.btn-view { background-color: #2c73d2; text-decoration: none !important; color: #ffffff;}
.btn-view:hover { background-color: #1f5bb0; text-decoration: none !important; color: #ffffff;}
.btn-edit { background-color: #2c73d2; text-decoration: none !important; color: #ffffff;}
.btn-edit:hover { background-color: #1f5bb0; text-decoration: none !important; color: #ffffff;}
.btn-delete { background-color: #c73424; text-decoration: none !important; color: #ffffff;}
.btn-delete:hover { background-color: #96271b; text-decoration: none !important; color: #ffffff;}
.btn-search { background-color: #2c73d2; text-decoration: none !important; color: #ffffff;}
.btn-search:hover { background-color: #1f5bb0; text-decoration: none !important; color: #ffffff;}
.btn-add { background-color: #27ae60; text-decoration: none !important; color: #ffffff;} 
.btn-add:hover { background-color: #1e8749; text-decoration: none !important; color: #ffffff;}
.btn-back { background-color: #949494; text-decoration: none !important; color: #ffffff;} 
.btn-back:hover { background-color: #757575; text-decoration: none !important; color: #ffffff;}

.btn-save { background-color: #27ae60; text-decoration: none !important; color: #ffffff;} 
.btn-save:hover { background-color: #1e8749; text-decoration: none !important; color: #ffffff;}

.btn-cancel { background-color: #c73424; text-decoration: none !important; color: #ffffff;}
.btn-cancel:hover { background-color: #96271b; text-decoration: none !important; color: #ffffff;}

@media (max-width: 768px) {
    .org-container {
        margin: 16px auto;
        padding-bottom: 24px;
    }

    .header {
        margin: 12px 0 20px 0;
    }

    .header h1 {
        font-size: 1.5rem;
        line-height: 1.2;
    }

    .section-box {
        padding: 16px 14px;
        border-radius: 10px;
    }

    .section-box h2 {
        font-size: 1.05rem;
    }

    .section-grid {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .section-grid input,
    .section-grid select,
    textarea {
        font-size: 16px;
    }

    textarea {
        min-height: 120px;
    }

    .action-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .action-row .btn,
    .action-row a {
        width: 100%;
    }

    .action-row .btn {
        width: 100%;
    }
}
</style>

<div class="org-container">

    <div class="header">
        <h1>Edytuj organizację</h1>
    </div>

    <form method="POST">

        <div class="section-box">
            <h2>Dane podstawowe</h2>

            <div class="section-grid">

                <div>
                    <label>Nazwa</label>
                    <input name="org_nazwa" value="{{ org.org_nazwa }}">
                </div>

                <div>
                    <label>Skrót</label>
                    <input name="org_skrot" value="{{ org.org_skrot }}">
                </div>

                <div class="form-group">
                    <label>Typ</label>
                    <select name="org_typ">
                        <option value="">— wybierz —</option>
                        <option value="polityczna">Polityczna</option>
                        <option value="wojskowa">Wojskowa</option>
                        <option value="gospodarcza">Gospodarcza</option>
                        <option value="naukowa">Naukowa</option>
                        <option value="polityczno-gospodarcza">Polityczno-gospodarcza</option>
                        <option value="polityczno-wojskowa">Polityczno-wojskowa</option>
                        <option value="gospodarczo-wojskowa">Gospodarczo-wojskowa</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Siedziba</label>
                    <input type="text" name="siedziba" value="{{ org.siedziba }}">
                </div>

                <div>
                    <label>Status</label>
                    <select name="czy_aktywna">
                        <option value="1" {% if org.czy_aktywna %}selected{% endif %}>AKTYWNA</option>
                        <option value="0" {% if not org.czy_aktywna %}selected{% endif %}>NIEAKTYWNA</option>
                    </select>
                </div>

            </div>
        </div>

        <div class="section-box">
            <h2>Opis</h2>
            <textarea name="org_opis">{{ org.org_opis }}</textarea>
        </div>

        <div class="action-row">
            <button type="submit" class="btn-zeus btn-save">Zapisz</button>
            <a href="/dyplomacja/organizacje">
                <button type="button" class="btn-zeus btn-back">Wróć</button>
            </a>
        </div>

    </form>

</div>

{% endblock %}
